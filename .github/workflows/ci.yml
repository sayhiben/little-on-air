name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32-controller:
    name: ESP32-S3 controller
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache PlatformIO dependencies
        uses: actions/cache@v6
        with:
          # Keep build output fresh; cache only downloads and installed packages.
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            apps/controller-esp32s3/.pio/libdeps
          key: platformio-v1-${{ runner.os }}-${{ runner.arch }}-6.1.18-${{ hashFiles('apps/controller-esp32s3/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Configure host tests
        run: cmake -S tests/host -B build/desk-tests
      - name: Build host tests
        run: cmake --build build/desk-tests
      - name: Run host tests
        run: ctest --test-dir build/desk-tests --output-on-failure
      - name: Build ESP32-S3 controller
        run: python -m platformio run -d apps/controller-esp32s3
      - name: Render and check OLED screens
        run: |
          python -m pip install Pillow==10.4.0
          python tools/render_buddy_ui.py
      - name: Stage controller images
        run: |
          mkdir -p build/controller-images
          cp apps/controller-esp32s3/.pio/build/xiao_esp32s3/{firmware.bin,firmware.elf,bootloader.bin,partitions.bin} build/controller-images/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin build/controller-images/
      - name: Upload controller images
        uses: actions/upload-artifact@v6
        with:
          name: little-on-air-controller-${{ github.sha }}
          if-no-files-found: error
          path: build/controller-images/
      - name: Upload OLED preview
        uses: actions/upload-artifact@v6
        with:
          name: little-on-air-oled-${{ github.sha }}
          path: build/buddy-ui/oled-preview.png

  test-and-build:
    name: test-and-build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out project
        uses: actions/checkout@v5
        with:
          path: little-on-air
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up cached Zephyr workspace
        uses: ./little-on-air/.github/actions/setup-zephyr

      - name: Check whitespace
        working-directory: little-on-air
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Check C formatting
        working-directory: little-on-air
        run: >-
          git ls-files -z '*.c' '*.h' |
          xargs -0 clang-format --dry-run --Werror
          --style="file:../zephyr/.clang-format"

      - name: Run unit tests
        working-directory: little-on-air
        run: west twister -T tests/unit -v --inline-logs --integration --outdir build/twister

      - name: Build receiver
        working-directory: little-on-air
        run: west build -b xiao_ble/nrf52840 apps/receiver -d build/receiver

      - name: Build receiver USB diagnostics
        working-directory: little-on-air
        run: >-
          west build -b xiao_ble/nrf52840 apps/receiver -d build/receiver-debug --
          -DEXTRA_CONF_FILE=debug.conf
          -DEXTRA_DTC_OVERLAY_FILE="$PWD/boards/xiao_ble_nrf52840_debug.overlay"

      - name: Verify current receiver pixel waveform
        working-directory: little-on-air
        run: >-
          python tools/simulate_pixels.py
          --devicetree-header build/receiver/zephyr/include/generated/zephyr/devicetree_generated.h

      - name: Upload receiver images
        uses: actions/upload-artifact@v6
        with:
          name: little-on-air-receiver-${{ github.sha }}
          if-no-files-found: error
          path: |
            little-on-air/build/receiver/zephyr/zephyr.uf2
            little-on-air/build/receiver/zephyr/zephyr.elf

      - name: Upload receiver test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: little-on-air-receiver-checks-${{ github.sha }}
          if-no-files-found: warn
          path: |
            little-on-air/build/twister/*.xml
            little-on-air/build/twister/*.json
            little-on-air/build/receiver-debug/zephyr/zephyr.uf2
            little-on-air/build/receiver-debug/zephyr/zephyr.elf
            little-on-air/build/pixel-simulation/simulation.json
            little-on-air/build/pixel-simulation/*.spi.bin

  firmware-bundle:
    name: Current firmware bundle
    needs: [esp32-controller, test-and-build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/package_firmware.py
            /docs/FLASHING.md
            /apps/controller-esp32s3/src/main.cpp
            /VERSION
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: little-on-air-controller-${{ github.sha }}
          path: build/controller-images
      - uses: actions/download-artifact@v7
        with:
          name: little-on-air-receiver-${{ github.sha }}
          path: build/receiver-images
      - name: Package the tested device pair
        run: >-
          python tools/package_firmware.py
          --controller-dir build/controller-images
          --receiver-dir build/receiver-images
          --output build/firmware-release
          --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v6
        with:
          name: little-on-air-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/firmware-release/*.zip
            build/firmware-release/*.zip.sha256
