name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  esp32-controller:
    name: ESP32-S3 controller
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Configure host tests
        run: cmake -S apps/controller-esp32s3/test -B build/desk-tests
      - name: Build host tests
        run: cmake --build build/desk-tests
      - name: Run host tests
        run: ctest --test-dir build/desk-tests --output-on-failure
      - name: Build ESP32-S3 controller
        run: python -m platformio run -d apps/controller-esp32s3
      - name: Render and check OLED screens
        run: |
          python -m pip install Pillow==10.4.0
          python tools/render_buddy_ui.py
      - name: Upload ESP32-S3 images
        uses: actions/upload-artifact@v6
        with:
          name: little-on-air-esp32s3-${{ github.sha }}
          path: |
            apps/controller-esp32s3/.pio/build/xiao_esp32s3/firmware.bin
            apps/controller-esp32s3/.pio/build/xiao_esp32s3/firmware.elf
            apps/controller-esp32s3/.pio/build/xiao_esp32s3/bootloader.bin
            apps/controller-esp32s3/.pio/build/xiao_esp32s3/partitions.bin
            build/buddy-ui/oled-preview.png

  test-and-build:
    name: test-and-build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out project
        uses: actions/checkout@v5
        with:
          path: little-on-air
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Zephyr 4.3 toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: little-on-air
          toolchains: arm-zephyr-eabi
          ccache-cache-key: little-on-air-v0

      - name: Check whitespace
        working-directory: little-on-air
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Check C formatting
        working-directory: little-on-air
        run: >-
          git ls-files -z '*.c' '*.h' |
          xargs -0 clang-format --dry-run --Werror
          --style="file:../zephyr/.clang-format"

      - name: Run unit tests
        working-directory: little-on-air
        run: west twister -T tests -v --inline-logs --integration

      - name: Build controller
        working-directory: little-on-air
        run: west build -b xiao_ble/nrf52840 apps/controller -d build/controller

      - name: Build receiver
        working-directory: little-on-air
        run: west build -b xiao_ble/nrf52840 apps/receiver -d build/receiver

      - name: Build receiver with padded pixel transmission
        working-directory: little-on-air
        run: >-
          west build -b xiao_ble/nrf52840 apps/receiver -d build/receiver-pixels-padded --
          -DEXTRA_CONF_FILE="pixels.conf;pixels-padded.conf"
          -DEXTRA_DTC_OVERLAY_FILE="$PWD/boards/xiao_ble_nrf52840_pixels.overlay"

      - name: Simulate padded pixel waveform
        working-directory: little-on-air
        run: >-
          python tools/simulate_pixels.py
          --devicetree-header build/receiver-pixels-padded/zephyr/include/generated/zephyr/devicetree_generated.h

      - name: Build receiver with 375 ns pixel timing
        working-directory: little-on-air
        run: >-
          west build -b xiao_ble/nrf52840 apps/receiver -d build/receiver-pixels-timing375 --
          -DEXTRA_CONF_FILE="pixels.conf;pixels-padded.conf;pixels-timing375.conf"
          -DEXTRA_DTC_OVERLAY_FILE="$PWD/boards/xiao_ble_nrf52840_pixels.overlay;$PWD/boards/xiao_ble_nrf52840_pixels_timing375.overlay"

      - name: Verify 375 ns pixel waveform
        working-directory: little-on-air
        run: >-
          python tools/simulate_pixels.py --profile timing375
          --devicetree-header build/receiver-pixels-timing375/zephyr/include/generated/zephyr/devicetree_generated.h

      - name: Upload test reports and firmware
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: little-on-air-ci-${{ github.sha }}
          if-no-files-found: warn
          path: |
            little-on-air/twister-out/*.xml
            little-on-air/twister-out/*.json
            little-on-air/build/controller/zephyr/zephyr.uf2
            little-on-air/build/controller/zephyr/zephyr.elf
            little-on-air/build/receiver/zephyr/zephyr.uf2
            little-on-air/build/receiver/zephyr/zephyr.elf
            little-on-air/build/receiver-pixels-padded/zephyr/zephyr.uf2
            little-on-air/build/receiver-pixels-padded/zephyr/zephyr.elf
            little-on-air/build/pixel-simulation/simulation.json
            little-on-air/build/pixel-simulation/*.spi.bin
            little-on-air/build/receiver-pixels-timing375/zephyr/zephyr.uf2
            little-on-air/build/receiver-pixels-timing375/zephyr/zephyr.elf
            little-on-air/build/pixel-simulation-timing375/simulation.json
            little-on-air/build/pixel-simulation-timing375/*.spi.bin
