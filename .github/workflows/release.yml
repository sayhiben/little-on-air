name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /VERSION
      - name: Verify release version
        run: test "v$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download tested device-pair bundle
        uses: actions/download-artifact@v7
        with:
          name: little-on-air-firmware-${{ github.sha }}
          path: build/firmware-release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/firmware-release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Little On Air $GITHUB_REF_NAME"
