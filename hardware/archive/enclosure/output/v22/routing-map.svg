y="585" class="label" style="fill:#822b32">H0 LED harness junction to front connector</text><text x="763" y="274" class="small">BAT 52 x 21 x 10</text><text x="827" y="254" class="small">Pigtail</text><text x="631" y="174" class="small">CHARGER</text><text x="967" y="222" class="small">XIAO</text><text x="715" y="102" class="small">POWER</text><text x="795" y="102" class="small">MODE</text><text x="903" y="158" class="small">C1</text><text x="35" y="658" font-size="18">Keep the LED current out of the tiny DPDT</text><text x="35" y="685" class="label">S1 switched rail branches to LED+ and C1+ directly. S2 switches only XIAO BAT+ and the data signal.</text><text x="35" y="711" class="label">Front harness mainly d13.7; lower H2 at d18; P4 at d18; D1 crossing at d16, then d15 near XIAO.</text><text x="35" y="737" class="label">Purple bays allow insulated fan-out and service slack. Follow the 3D depths in the route list; avoid grey screw bosses.</text><text x="35" y="781" font-size="18">Before either USB: POWER OFF + PROGRAM. Use one USB port at a time.</text></svg>