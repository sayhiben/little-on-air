<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">ON AIR: capacitor and data resistor connections</title>
  <desc id="desc">C1, a polarized 680 microfarad capacitor, connects between switched battery power after S1 and protected ground from charger OUT minus. R1, a 330 ohm resistor, connects in series between the front DATA pigtail and LED1 DIN. No capacitor current passes through the small S2 switch.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#536477"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#203044;font-size:20px}
      .title{font-size:30px;font-weight:bold}.heading{font-size:24px;font-weight:bold}.small{font-size:17px}.label{font-weight:bold}.muted{fill:#536477}
      .power{stroke:#c44e3e}.ground{stroke:#356e9c}.data{stroke:#7952a3}
      .wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#fff;stroke:#c6d0db;stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="960" fill="#f3f6f9"/>
  <text x="40" y="49" class="title">ON AIR · Two parts, two different connections</text>
  <text x="40" y="82" class="muted">Connection diagram only · switches shown ON / RUN · full battery and MCU wiring is in WIRING.md</text>

  <rect x="25" y="108" width="1230" height="440" rx="15" fill="#fff"/>
  <text x="48" y="149" class="heading">C1 connects ACROSS power and ground</text>
  <text x="48" y="178" class="small muted">A small energy reserve helps smooth brief changes in the LEDs' power demand.</text>

  <rect x="48" y="212" width="176" height="218" rx="8" class="box"/>
  <text x="68" y="245" class="label">Charging board</text>
  <text x="68" y="280">OUT+</text>
  <text x="68" y="400">OUT−</text>
  <path d="M224 273 H314" class="wire power"/>
  <rect x="314" y="239" width="180" height="68" rx="8" fill="#fff5e6" stroke="#c9a065" stroke-width="2"/>
  <text x="404" y="264" text-anchor="middle" class="label">S1 · POWER</text>
  <text x="404" y="290" text-anchor="middle" class="small">COM → ON</text>
  <path d="M494 273 H988" class="wire power"/>
  <circle cx="587" cy="273" r="6" fill="#c44e3e"/>
  <text x="654" y="252" class="label" style="fill:#c44e3e">VBAT_SW</text>

  <path d="M224 393 H988" class="wire ground"/>
  <circle cx="587" cy="393" r="6" fill="#356e9c"/>
  <text x="655" y="422" class="small" style="fill:#356e9c">Protected ground (OUT−)</text>

  <path d="M587 273 V316 M560 316 H614" class="wire power"/>
  <path d="M560 340 Q587 325 614 340 M587 333 V393" class="wire ground"/>
  <text x="532" y="310" class="label" style="fill:#c44e3e">+</text>
  <text x="532" y="365" class="label" style="fill:#356e9c">−</text>
  <text x="650" y="325" class="label">C1 · 680 µF</text>
  <text x="650" y="352" class="small">Rated ≥6.3 V</text>
  <text x="650" y="377" class="small">Negative stripe → ground</text>

  <rect x="988" y="229" width="234" height="200" rx="8" fill="#f5f8fc" stroke="#c6d0db" stroke-width="2"/>
  <text x="1005" y="252" class="label">Front pigtail → LEDs</text>
  <text x="1005" y="281" style="fill:#c44e3e">VBAT_SW → LED +</text>
  <text x="1005" y="401" style="fill:#356e9c">GND → LED GND</text>

  <text x="48" y="472" class="label">Make two branch splices; both main power wires continue to the LEDs.</text>
  <text x="48" y="505" class="small muted">C1 stays in the rear capacitor bay. Its + branch comes after S1 and before S2; its − branch uses OUT−, not B−.</text>

  <rect x="25" y="573" width="1230" height="277" rx="15" fill="#fff"/>
  <text x="48" y="613" class="heading">R1 goes IN the data wire, just before LED1 DIN</text>
  <text x="48" y="643" class="small muted">The data signal passes through the resistor. Either resistor lead can face either way.</text>

  <rect x="48" y="688" width="144" height="68" rx="8" class="box"/>
  <text x="120" y="715" text-anchor="middle" class="label">XIAO</text>
  <text x="120" y="742" text-anchor="middle" class="small">D2 / P0.28</text>
  <path d="M192 722 H245 M431 722 H480 M702 722 H779 M877 722 H974" class="wire data"/>
  <rect x="245" y="688" width="186" height="68" rx="8" fill="#fff5e6" stroke="#c9a065" stroke-width="2"/>
  <text x="338" y="715" text-anchor="middle" class="label">S2 · MODE, pole B</text>
  <text x="338" y="742" text-anchor="middle" class="small">RUN → COM</text>
  <rect x="480" y="688" width="222" height="68" rx="8" class="box"/>
  <text x="591" y="715" text-anchor="middle" class="label">Service pigtail</text>
  <text x="591" y="742" text-anchor="middle" class="small">DATA to front half</text>
  <rect x="779" y="708" width="98" height="28" fill="#eee6f6" stroke="#7952a3" stroke-width="3"/>
  <text x="828" y="690" text-anchor="middle" class="label">R1 · 330 Ω</text>
  <rect x="974" y="688" width="248" height="68" rx="8" class="box"/>
  <text x="1098" y="715" text-anchor="middle" class="label">LED1 DIN</text>
  <text x="1098" y="742" text-anchor="middle" class="small">First pixel's INPUT pad</text>
  <text x="48" y="799" class="small muted">Put R1 in the reserved space behind LED1. Its DOUT connects directly to LED2 DIN, then LED3 and LED4.</text>
  <text x="48" y="828" class="small muted">Do not connect R1 to + or GND, and do not leave a DATA wire bypassing it.</text>

  <text x="40" y="895" class="label">Before soldering: disconnect the battery and both USB cables.</text>
  <text x="40" y="928" class="small muted">Insulate each exposed lead and splice separately. Use pad labels and continuity checks to identify every connection.</text>
</svg>
